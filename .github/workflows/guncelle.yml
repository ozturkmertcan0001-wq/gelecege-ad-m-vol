name: Saatlik Kamu İlan Tarayıcı

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı çalışır
  workflow_dispatch:      # Manuel olarak "Run workflow" ile çalıştırılabilmesini sağlar

permissions:
  contents: write         # Depoya dosya yazabilmek (commit/push yapabilmek) için kritik yetki

jobs:
  tara-ve-guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 schedule

      - name: Botu Çalıştır (İlanları Tara)
        run: python bot.py

      - name: Değişiklikleri Depoya Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ilanlar.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: Güncel ilanlar tarandı [skip ci]" && git push)
