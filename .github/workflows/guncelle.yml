name: Saatlik Kamu İlan Tarayıcı

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tara-ve-guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: pip install requests beautifulsoup4 schedule

      - name: Botu Bir Kez Çalıştır
        run: python -c "import bot; bot.portallari_tara()"

      - name: Güncel ilanlar.json Dosyasını Kaydet
        run: |
          git config user.name "GelecegeAdim-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add ilanlar.json
          git diff --staged --quiet || git commit -m "Saatlik otomatik ilan güncellemesi"
          git push
